name: Scanly CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: scanlyavdijaacr2026
  ACR_LOGIN_SERVER: scanlyavdijaacr2026.azurecr.io
  IMAGE_NAME: scanly-api
  RESOURCE_GROUP: RG-Avdija-Mahmutovic-a632c3-DotNetCloudDeveloper-VT-Mars-Goteborg
  CONTAINER_APP_NAME: scanly-api

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Scanly-AB.csproj

      - name: Build
        run: dotnet build Scanly-AB.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Scanly-AB.csproj -c Release --no-build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build Docker image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Push Docker image to ACR
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: Deploy to Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade --yes

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify health
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          curl --fail "https://$FQDN/health"